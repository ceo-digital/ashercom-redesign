<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://ashercom.com/articles.html">
  <title>מאמרים — אשר תקשורת</title>
  <meta name="description" content="מאמרים על תשתיות תקשורת, סיבים, רשתות, מצלמות אבטחה וארונות שרתים.">
  <link rel="preload" href="assets/fonts/plex-hebrew-hebrew-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/article.css">
</head>
<body data-theme="server" data-nav="articles" data-contact="local">
  <div id="site-header"></div>
  <main id="main" class="articles-index">
    <div class="page-head">
      <div class="wrap">
        <div class="article-kicker">ידע מהשטח</div>
        <h1>מאמרים</h1>
      </div>
    </div>
    <div class="list wrap">
      <div id="lead"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="contact-slot"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/urls.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/contact-form.js"></script>
  <script src="js/privacy-consent.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/articles-data.js"></script>
  <script>
    const all = window.ASHER_ARTICLES || [];
    const [lead, ...rest] = all;
    document.getElementById("lead").innerHTML = `
      <a class="lead-card" href="${(window.asherHref && window.asherHref.article(lead.id)) || ("article.html?id=" + lead.id)}">
        <div class="lead-copy">
          <span>${lead.tag} · ${lead.read}</span>
          <h2>${lead.title}</h2>
          <p>${lead.dek}</p>
        </div>
        <img src="${lead.img}" alt="">
      </a>`;
    document.getElementById("grid").innerHTML = rest.map(a => `
      <a class="article" href="${(window.asherHref && window.asherHref.article(a.id)) || ("article.html?id=" + a.id)}">
        <img src="${a.img}" alt="">
        <div class="article-body">
          <span>${a.tag}</span>
          <h3>${a.title}</h3>
          <p>${a.dek}</p>
        </div>
      </a>`).join("");
    document.getElementById("contact-slot").innerHTML = window.ASHER_CONTACT_HTML || "";
  </script>
</body>
</html>
