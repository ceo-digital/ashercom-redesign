<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>שירות — אשר תקשורת</title>
  <link rel="preload" href="assets/fonts/plex-hebrew-hebrew-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/article.css">
</head>
<body data-theme="server" data-nav="">
  <div id="site-header"></div>
  <main id="main"></main>
  <div id="site-footer"></div>
  <script src="js/urls.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/contact-form.js"></script>
  <script src="js/privacy-consent.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/services-data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "fiber";
    const all = window.ASHER_SERVICES || [];
    const service = all.find(s => s.id === id) || all[0];
    const related = (service.related || []).map(rid => all.find(s => s.id === rid)).filter(Boolean).slice(0, 3);
    const hrefS = (window.asherHref && window.asherHref.service) || (x => "service.html?id=" + x);
    const rewrite = (window.asherHref && window.asherHref.rewrite) || (x => x);
    document.title = service.title + " — אשר תקשורת";
    document.getElementById("main").innerHTML = rewrite(`
      <section class="article-hero">
        <div class="wrap">
          <div class="crumbs">
            <a href="index.html">בית</a>
            <span>·</span>
            <a href="index.html#services">שירותים</a>
            <span>·</span>
            <span>${service.tag}</span>
          </div>
          <div class="article-kicker">${service.tag}</div>
          <h1>${service.title}</h1>
          <p class="meta">${service.read} · אשר תקשורת</p>
        </div>
      </section>
      <section class="article-body-band">
      <div class="wrap article-layout">
        <article class="prose">${service.body}</article>
        <aside class="article-cover">
          <img src="${service.img}" alt="${service.title}">
        </aside>
      </div>
      </section>
      <section class="related">
        <div class="wrap">
          <h2>עוד לקריאה</h2>
          <div class="related-grid">
            ${related.map(r => `
              <a class="article" href="${hrefS(r.id)}">
                <img src="${r.img}" alt="">
                <div class="article-body">
                  <span>${r.tag}</span>
                  <h3>${r.title}</h3>
                  <p>${r.dek}</p>
                </div>
              </a>`).join("")}
          </div>
        </div>
      </section>
      <section class="svc-strip">
        <div class="wrap">
          <div class="svc-pills">
            <a href="ארונות-תקשורת/">ארונות שרתים</a>
            <a href="מערכת-מצלמות-אבטחה/">מצלמות אבטחה</a>
            <a href="סיבים-אופטיים/">סיבים אופטיים</a>
            <a href="רשת-מחשבים-לחברות-ועסקים/">רשתות מחשבים</a>
            <a href="תקשורת-טלפוניה/">טלפוניה</a>
            <a href="מערכות-מתח-נמוך/">מתח נמוך</a>
          </div>
        </div>
      </section>
    `);
  </script>
</body>
</html>
